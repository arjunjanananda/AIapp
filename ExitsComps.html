<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Swag - Exit & Comps Analyzer</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* --- Base Styles & Variables (Dark Theme) --- */
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-primary: #4a90e2; /* Blue */
            --accent-secondary: #2980b9; /* Slightly more corporate blue for finance/exit */
            --border-color: #3a3a3a;
            --border-light: #555;
            --card-border: #444;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .analyzer-container {
            max-width: 1100px; /* Good width */
            margin: 20px auto;
            padding: 25px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .analyzer-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px; /* Space below header */
        }

        .analyzer-header h1 {
            font-size: 1.8em;
            font-weight: 600;
            color: var(--accent-secondary);
        }
        .analyzer-header h1 i {
            margin-right: 10px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: var(--text-primary);
        }
        .back-link i {
            margin-right: 5px;
        }

        /* --- Step Section Styling --- */
         .step-section {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }
         .step-section h2 {
             font-size: 1.3em;
             font-weight: 600;
             margin-bottom: 20px;
             color: var(--text-primary);
             border-bottom: 1px solid var(--border-light);
             padding-bottom: 10px;
              display: flex;
             align-items: center;
             gap: 10px;
         }
          .step-section h2 .step-number {
              background-color: var(--accent-secondary);
              color: #fff;
              border-radius: 50%;
              width: 28px;
              height: 28px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              font-size: 0.8em;
              font-weight: bold;
          }

        /* --- Context & Options Grids --- */
        .context-options-grid {
             display: grid;
             grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
             gap: 20px 25px; /* Row and column gap */
         }
         .form-group {
             display: flex;
             flex-direction: column;
             margin-bottom: 10px; /* Add some space below each group */
         }
         .form-group label {
             margin-bottom: 6px;
             font-size: 0.9em;
             color: var(--text-secondary);
             font-weight: 500;
         }
          .form-group label i { margin-right: 5px; }
         .form-group input[type="text"],
         .form-group input[type="number"],
         .form-group select,
         .form-group textarea {
             width: 100%;
             padding: 10px 12px;
             background-color: var(--bg-input);
             border: 1px solid var(--border-color);
             border-radius: 4px;
             color: var(--text-primary);
             font-family: inherit;
             font-size: 0.95em;
         }
          .form-group textarea {
             min-height: 60px;
             resize: vertical;
         }
          .form-group input:focus,
          .form-group select:focus,
          .form-group textarea:focus {
              outline: none;
              border-color: var(--accent-primary);
              box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
          }
          .form-group small { /* Help text */
               font-size: 0.8em;
               color: var(--text-secondary);
               margin-top: 4px;
           }
         /* Checkbox styling */
         .checkbox-group label {
              display: flex;
              align-items: center;
              cursor: pointer;
              font-weight: normal; /* Normal weight for checkbox labels */
              color: var(--text-primary);
         }
          .checkbox-group input[type="checkbox"] {
             margin-right: 8px;
             accent-color: var(--accent-secondary);
             width: 15px;
             height: 15px;
         }


         /* --- Analyze Trigger --- */
         .analyze-trigger-section {
            text-align: center;
            padding-top: 10px;
             margin-bottom: 25px;
         }
          #analyze-button {
            padding: 12px 35px; /* Larger button */
            font-size: 1.1em;
            background-color: var(--accent-secondary); /* Use accent color */
            color: #fff; /* White text */
            font-weight: 600;
        }
        #analyze-button:hover {
             background-color: #1f618d; /* Darker blue */
        }
         #analyze-button:disabled {
             opacity: 0.5; cursor: not-allowed; background-color: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color);
         }


        /* --- Results Section --- */
         #results-section {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
         }
         #results-section h2 {
            font-size: 1.4em; font-weight: 600; margin-bottom: 20px; color: var(--text-primary); border-bottom: 1px solid var(--border-light); padding-bottom: 10px; display: flex; align-items: center; gap: 10px;
         }
          #results-section h2 .step-number { /* Reuse step number style */
             background-color: var(--accent-secondary); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold;
         }

         #analysis-status {
             text-align: center; margin-bottom: 25px; font-size: 1.1em; color: var(--accent-primary); padding: 15px; background-color: var(--bg-input); border-radius: 6px;
         }
         #analysis-status i { margin-right: 8px; }

         .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); /* Slightly wider cards */
            gap: 25px; /* Space between result blocks */
         }

         .result-block {
            background-color: var(--bg-input); padding: 20px; border-radius: 6px; border: 1px solid var(--card-border);
         }
          .result-block h3 {
            font-size: 1.15em; font-weight: 600; color: var(--accent-secondary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light);
         }
           .result-block h3 i { font-size: 1.1em; } /* Icon size */

         /* Content styling within blocks */
          .result-block p, .result-block ul {
             font-size: 0.95em; line-height: 1.6; color: var(--text-primary); margin-bottom: 10px;
         }
          .result-block ul { list-style: disc; padding-left: 20px; }
          .result-block li { margin-bottom: 8px; }
          .result-block strong { color: var(--text-primary); font-weight: 600; }
          .result-block .rationale { /* Specific styling for rationale */
             font-size: 0.9em; color: var(--text-secondary); margin-top: 5px; padding-left: 15px; border-left: 2px solid var(--border-color);
          }
          .result-block .valuation-range {
              font-size: 1.2em;
              font-weight: bold;
              color: var(--success-color); /* Green for valuation */
              display: block;
              text-align: center;
              margin: 10px 0;
              padding: 10px;
              background-color: rgba(46, 204, 113, 0.1);
              border-radius: 4px;
          }


         /* Comps Table Styling */
         .comps-table-container {
             max-height: 300px; /* Limit table height */
             overflow-y: auto;
             border: 1px solid var(--border-color);
             border-radius: 4px;
             margin-top: 10px;
         }
         .comps-table {
             width: 100%;
             border-collapse: collapse;
         }
         .comps-table th, .comps-table td {
             padding: 8px 12px;
             text-align: left;
             border-bottom: 1px solid var(--border-color);
             font-size: 0.9em;
         }
         .comps-table th {
             background-color: var(--bg-tertiary);
             font-weight: 600;
             position: sticky; top: 0; /* Sticky header */
         }
         .comps-table td:nth-child(n+2) { /* Right-align numeric columns */
            text-align: right;
         }
         .comps-table tr:last-child td {
            border-bottom: none;
         }
         .comps-table tr:hover td {
            background-color: #333;
         }

        /* General Button Style */
        .btn {
            padding: 9px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95em; font-weight: 500; transition: background-color 0.2s ease, opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease; font-family: var(--font-family); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
        }
        .btn i { margin-right: 8px; }

        /* Utility */
        .hidden { display: none !important; }
    </style>

</head>
<body>

    <div class="analyzer-container">
        <header class="analyzer-header">
            <a href="AIApp222.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Hub</a>
            <h1><i class="fas fa-balance-scale-right"></i> Exit & Comps Analyzer</h1>
        </header>

        <section id="context-section" class="step-section">
             <h2><span class="step-number">1</span> Company Context</h2>
             <div class="context-options-grid">
                 <div class="form-group">
                     <label for="company-name"><i class="fas fa-building"></i> Company Name*</label>
                     <input type="text" id="company-name" placeholder="e.g., AI Swag Inc.">
                 </div>
                  <div class="form-group">
                     <label for="industry-sector"><i class="fas fa-industry"></i> Industry/Sector*</label>
                     <input type="text" id="industry-sector" placeholder="e.g., Enterprise SaaS, AI Tools">
                 </div>
                 <div class="form-group">
                     <label for="company-stage"><i class="fas fa-layer-group"></i> Company Stage*</label>
                     <select id="company-stage">
                         <option value="">Select Stage...</option>
                         <option value="Seed">Seed</option>
                         <option value="Series A">Series A</option>
                         <option value="Series B">Series B</option>
                         <option value="Growth Stage">Growth Stage (C+)</option>
                         <option value="Late Stage / Pre-IPO">Late Stage / Pre-IPO</option>
                         <option value="Public">Public</option>
                     </select>
                 </div>
                 <div class="form-group">
                     <label for="revenue-metric"><i class="fas fa-dollar-sign"></i> Key Revenue Metric (Approx)*</label>
                     <input type="text" id="revenue-metric" placeholder="e.g., $5M ARR, $500k MRR, $10M TTM Revenue">
                     <small>Provide latest ARR, MRR, or TTM Revenue.</small>
                 </div>
                 <div class="form-group">
                     <label for="growth-rate"><i class="fas fa-chart-line"></i> Growth Rate (Approx YoY)*</label>
                     <input type="text" id="growth-rate" placeholder="e.g., 150% YoY, 2x YoY">
                     <small>Year-over-Year growth for the key revenue metric.</small>
                 </div>
                 <div class="form-group" style="grid-column: 1 / -1;">
                     <label for="company-description"><i class="fas fa-info-circle"></i> Brief Description / Value Prop*</label>
                     <textarea id="company-description" rows="2" placeholder="e.g., AI platform automating customer support workflows for e-commerce businesses."></textarea>
                 </div>
            </div>
        </section>

        <section id="analysis-params-section" class="step-section">
             <h2><span class="step-number">2</span> Analysis Parameters</h2>
             <div class="context-options-grid">
                  <div class="form-group checkbox-group">
                     <label><i class="fas fa-sign-out-alt"></i> Exit Focus (Select one or both)</label>
                     <div style="display: flex; gap: 20px; margin-top: 5px;">
                        <label><input type="checkbox" name="exit_focus" value="m&a" checked> M&A Analysis</label>
                        <label><input type="checkbox" name="exit_focus" value="ipo"> IPO Readiness/Comps</label>
                     </div>
                 </div>
                 <div class="form-group">
                     <label for="exit-timeframe"><i class="far fa-clock"></i> Exit Timeframe (Optional)</label>
                     <select id="exit-timeframe">
                        <option value="">Any Timeframe</option>
                        <option value="1-2 years">Near Term (1-2 years)</option>
                        <option value="3-5 years">Mid Term (3-5 years)</option>
                        <option value="5+ years">Long Term (5+ years)</option>
                     </select>
                 </div>
                  <div class="form-group" style="grid-column: 1 / -1;">
                     <label for="known-comps"><i class="fas fa-users"></i> Known Comparables or Acquirers (Optional)</label>
                     <textarea id="known-comps" rows="2" placeholder="List any specific public comps, private comps, or potential strategic acquirers to consider (comma-separated)."></textarea>
                 </div>
             </div>
        </section>

         <section id="analyze-trigger-section" class="analyze-trigger-section">
            <button id="analyze-button" class="btn" disabled><i class="fas fa-calculator"></i> Analyze Exit & Comps</button>
        </section>

        <section id="results-section" class="step-section hidden">
             <h2><span class="step-number">3</span> Analysis Results</h2>
             <div id="analysis-status" class="hidden">
                 <i class="fas fa-spinner fa-spin"></i> Analyzing market data and comparable companies...
             </div>
             <div id="results-container" class="results-grid">
                 <!-- Result blocks will be appended here by JS -->
             </div>
        </section>

    </div> <!-- End analyzer Container -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const companyNameInput = document.getElementById('company-name');
            const industryInput = document.getElementById('industry-sector');
            const stageSelect = document.getElementById('company-stage');
            const revenueInput = document.getElementById('revenue-metric');
            const growthInput = document.getElementById('growth-rate');
            const descriptionInput = document.getElementById('company-description');

            const exitFocusCheckboxes = document.querySelectorAll('input[name="exit_focus"]');
            const timeframeSelect = document.getElementById('exit-timeframe');
            const knownCompsInput = document.getElementById('known-comps');

            const analyzeButton = document.getElementById('analyze-button');
            const resultsSection = document.getElementById('results-section');
            const analysisStatus = document.getElementById('analysis-status');
            const resultsContainer = document.getElementById('results-container');

            // --- Functions ---

            function checkIfReadyToAnalyze() {
                // Define required context fields
                const nameText = companyNameInput.value.trim();
                const industryText = industryInput.value.trim();
                const stageValue = stageSelect.value;
                const revenueText = revenueInput.value.trim();
                const growthText = growthInput.value.trim();
                const descriptionText = descriptionInput.value.trim();

                // Check if at least one exit focus is selected
                let focusSelected = false;
                exitFocusCheckboxes.forEach(cb => { if (cb.checked) focusSelected = true; });

                // Enable button only if file selected AND required context fields have values
                analyzeButton.disabled = !(nameText && industryText && stageValue && revenueText && growthText && descriptionText && focusSelected);
            }

            function runAnalysis() {
                if (analyzeButton.disabled) return;

                 // Capture context and parameters at the time of analysis
                 const companyContext = {
                     name: companyNameInput.value.trim(),
                     industry: industryInput.value.trim(),
                     stage: stageSelect.value,
                     revenueMetric: revenueInput.value.trim(),
                     growthRate: growthInput.value.trim(),
                     description: descriptionInput.value.trim()
                 };
                 const analysisParams = {
                     focus: Array.from(exitFocusCheckboxes).filter(cb => cb.checked).map(cb => cb.value),
                     timeframe: timeframeSelect.value || null,
                     knownComps: knownCompsInput.value.trim() || null
                 };

                console.log("Analyzing Exit/Comps for:", companyContext);
                console.log("Parameters:", analysisParams);

                // Show processing state
                resultsSection.classList.remove('hidden'); // Show the section
                analysisStatus.classList.remove('hidden'); // Show spinner
                resultsContainer.innerHTML = ''; // Clear previous results
                analyzeButton.disabled = true; // Disable button
                analyzeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
                 // Optional: Disable inputs while analyzing
                 document.querySelectorAll('.step-section input, .step-section select, .step-section textarea, .step-section input[type=checkbox]').forEach(el => el.disabled = true);


                // --- *** SIMULATE BACKEND ANALYSIS (Gemini API Call) *** ---
                // In a real app:
                // 1. Send `companyContext` and `analysisParams` to your backend.
                // 2. Backend prepares a prompt for Gemini:
                //    "Analyze potential exit strategies (focusing on [M&A/IPO/Both]) and comparable company valuations for the following company:
                //     Name: [Name]
                //     Industry: [Industry]
                //     Stage: [Stage]
                //     Revenue: [Revenue Metric]
                //     Growth: [Growth Rate]
                //     Description: [Description]
                //     Desired Exit Timeframe: [Timeframe or Any]
                //     Known Comparables/Acquirers to consider: [Known Comps or None]
                //
                //     Based on current market conditions and data for the [Industry] sector:
                //     1.  **Exit Route Analysis:** Discuss the viability and pros/cons of M&A vs. IPO given the company's profile and timeframe.
                //     2.  **Potential Acquirers (if M&A focus):** List 3-5 likely strategic and/or financial buyers with a brief rationale for each.
                //     3.  **IPO Readiness (if IPO focus):** Assess readiness based on size, growth, market conditions, and typical IPO requirements. List key factors.
                //     4.  **Comparable Companies:** Identify 5-10 relevant public and private comparable companies. Provide key metrics like Revenue, Growth Rate, Market Cap (for public), or last known Valuation (for private).
                //     5.  **Valuation Benchmarks:** Calculate relevant median/average valuation multiples from the comps (e.g., EV/Revenue, EV/EBITDA if applicable).
                //     6.  **Estimated Valuation Range:** Provide a potential valuation range for the target company based on its metrics and the derived multiples. Explain the basis.
                //     7.  **Key Considerations:** List factors that could positively or negatively impact the exit outcome or valuation."
                // 3. Backend might need to integrate with financial data providers (e.g., Refinitiv, S&P Capital IQ APIs) or use Gemini's knowledge + web search to find comps data. This is complex.
                // 4. Receive structured analysis results (JSON) from the backend.

                setTimeout(() => {
                    analysisStatus.classList.add('hidden');
                    analyzeButton.disabled = false; // Re-enable button
                    analyzeButton.innerHTML = '<i class="fas fa-calculator"></i> Analyze Exit & Comps';
                     // Re-enable inputs if they were disabled
                     document.querySelectorAll('.step-section input, .step-section select, .step-section textarea, .step-section input[type=checkbox]').forEach(el => el.disabled = false);

                    // --- *** DISPLAY SIMULATED RESULTS *** ---
                    const simulatedResults = getSimulatedResults(companyContext, analysisParams);
                    displayResults(simulatedResults);

                    console.log("Simulated analysis complete.");

                }, 4000 + Math.random() * 2500); // Simulate longer analysis time
            }

            function displayResults(results) {
                 resultsContainer.innerHTML = ''; // Clear just in case

                 // 1. Exit Route Analysis
                 if (results.exitAnalysis) {
                     resultsContainer.innerHTML += createResultBlockHTML('exit', 'Exit Route Analysis', 'fas fa-route', `<p>${escapeHtml(results.exitAnalysis)}</p>`);
                 }

                 // 2. Potential Acquirers (If M&A focus)
                 if (results.acquirers && results.acquirers.length > 0) {
                      const acquirerItems = results.acquirers.map(item => `<li><strong>${escapeHtml(item.name)}:</strong> ${escapeHtml(item.rationale)}</li>`).join('');
                      resultsContainer.innerHTML += createResultBlockHTML('acquirers', 'Potential Acquirers', 'fas fa-handshake', `<ul>${acquirerItems}</ul>`);
                 }

                 // 3. IPO Readiness (If IPO focus)
                  if (results.ipoReadiness) {
                       const ipoItems = results.ipoReadiness.factors.map(item => `<li>${escapeHtml(item)}</li>`).join('');
                       const ipoContent = `<p><strong>Assessment:</strong> ${escapeHtml(results.ipoReadiness.assessment)}</p><ul>${ipoItems}</ul>`;
                       resultsContainer.innerHTML += createResultBlockHTML('ipo', 'IPO Readiness', 'fas fa-chart-area', ipoContent);
                  }


                 // 4. Comparable Companies
                 if (results.comparables && results.comparables.length > 0) {
                      resultsContainer.innerHTML += createCompsTableHTML('comps', 'Comparable Companies', 'fas fa-balance-scale', results.comparables);
                 }

                 // 5. Valuation Benchmarks & Range
                 if (results.valuation) {
                     const benchmarkItems = results.valuation.benchmarks.map(item => `<li><strong>${escapeHtml(item.metric)}:</strong> ${escapeHtml(item.multiple)} (Median based on comps)</li>`).join('');
                     const valuationContent = `
                         <p>Based on comparable company analysis and current market conditions:</p>
                         <ul>${benchmarkItems}</ul>
                         <p class="valuation-range">Estimated Valuation Range: ${escapeHtml(results.valuation.range)}</p>
                         <p class="rationale">${escapeHtml(results.valuation.basis)}</p>
                     `;
                     resultsContainer.innerHTML += createResultBlockHTML('valuation', 'Valuation Analysis', 'fas fa-tags', valuationContent);
                 }

                  // 6. Key Considerations
                 if (results.considerations && results.considerations.length > 0) {
                      const considerationItems = results.considerations.map(item => `<li>${escapeHtml(item)}</li>`).join('');
                      resultsContainer.innerHTML += createResultBlockHTML('considerations', 'Key Considerations & Risks', 'fas fa-exclamation-circle', `<ul>${considerationItems}</ul>`);
                 }
            }

             // Helper to create HTML for a standard result block
            function createResultBlockHTML(typeClass, title, iconClass, contentHTML) {
                 return `
                    <div class="result-block ${typeClass}">
                        <h3><i class="fas ${iconClass}"></i> ${escapeHtml(title)}</h3>
                        <div class="content">${contentHTML}</div>
                    </div>`;
            }

             // Helper to create HTML specifically for the comps table
             function createCompsTableHTML(typeClass, title, iconClass, compsData) {
                 let tableRows = compsData.map(comp => `
                    <tr>
                        <td>${escapeHtml(comp.name)} (${comp.type})</td>
                        <td>${escapeHtml(comp.metricValue || 'N/A')}</td>
                        <td>${escapeHtml(comp.multiple || 'N/A')}</td>
                    </tr>`).join('');

                 let tableHTML = `
                     <div class="comps-table-container">
                         <table class="comps-table">
                             <thead>
                                 <tr>
                                     <th>Company (Type)</th>
                                     <th>Relevant Metric</th>
                                     <th>Valuation / Multiple</th>
                                 </tr>
                             </thead>
                             <tbody>
                                 ${tableRows}
                             </tbody>
                         </table>
                     </div>
                 `;
                 return createResultBlockHTML(typeClass, title, iconClass, tableHTML);
             }


            function getSimulatedResults(context, params) {
                // Generate dummy results based on context/params
                const results = {
                     exitAnalysis: null,
                     acquirers: [],
                     ipoReadiness: null,
                     comparables: [],
                     valuation: null,
                     considerations: []
                };
                 const isMA = params.focus.includes('m&a');
                 const isIPO = params.focus.includes('ipo');
                 const industry = context.industry.split(' ')[0]; // Simple industry keyword

                 // Simulate Exit Analysis
                 if (context.stage === 'Seed' || context.stage === 'Series A') {
                     results.exitAnalysis = `At the ${context.stage} stage, M&A is the most likely exit path in the near-to-mid term (${params.timeframe || 'any timeframe'}). Potential acquirers in the ${context.industry} space often look for innovative tech or market entry points. An IPO is less likely without significant scale ($100M+ ARR typically) and proven profitability, likely 5+ years away.`;
                 } else if (context.stage.includes('Growth') || context.stage.includes('Late')) {
                      results.exitAnalysis = `For a ${context.stage} company in ${context.industry}, both M&A and IPO are potential options, depending on market conditions and strategic goals. ${isMA ? 'Strategic M&A remains viable.' : ''} ${isIPO ? 'IPO readiness should be assessed based on metrics, market window, and regulatory requirements.' : ''}`;
                 } else {
                       results.exitAnalysis = `Analysis depends heavily on specific metrics beyond stage. Generally, early exits favour M&A, while later stages open up IPO possibilities.`;
                 }


                 // Simulate Acquirers (if M&A focus)
                 if (isMA) {
                     results.acquirers = [
                         { name: `Large ${industry} Inc.`, rationale: `Strategic fit, looking to expand into ${context.description.split(' ')[1]} market.` },
                         { name: `Global Tech Conglomerate`, rationale: `Acquiring innovative AI capabilities aligned with their portfolio.` },
                         { name: `Private Equity Firm X`, rationale: `Potentially interested in roll-up strategy or growth equity investment.` },
                          ...(params.knownComps ? [{name: params.knownComps.split(',')[0].trim(), rationale: 'Mentioned as a potential comparable/acquirer.'}] : []) // Include mentioned comp
                     ].slice(0, 3 + Math.floor(Math.random()*2)); // Show 3-4
                 }

                 // Simulate IPO Readiness (if IPO focus)
                  if (isIPO && (context.stage.includes('Growth') || context.stage.includes('Late'))) {
                       results.ipoReadiness = {
                            assessment: `Moderately Ready - Requires Improvement`,
                            factors: [
                                 `Revenue Scale (${context.revenueMetric}) is approaching typical minimums, but predictability needs strengthening.`,
                                 `Growth Rate (${context.growthRate}) is strong, a positive factor.`,
                                 `Profitability path needs clearer demonstration.`,
                                 `Market conditions for ${context.industry} IPOs are currently [Favorable/Neutral/Challenging - Random].`,
                                 `Internal controls and reporting likely need SOX-compliance upgrades.`
                            ]
                       };
                  } else if (isIPO) {
                        results.ipoReadiness = {
                             assessment: `Early - Significant Development Needed`,
                             factors: [
                                  `Revenue scale (${context.revenueMetric}) is likely insufficient for current IPO market.`,
                                  `Focus should be on scaling and achieving predictable growth before considering IPO readiness.`
                             ]
                        };
                  }

                  // Simulate Comps
                  const numComps = 5 + Math.floor(Math.random() * 4); // 5-8 comps
                  const baseMultiple = 5 + Math.floor(Math.random() * 7); // Base Rev Multiple 5x-11x
                   for (let i = 0; i < numComps; i++) {
                        const isPublic = Math.random() > 0.4; // 60% chance public
                        const compMultiple = (baseMultiple + (Math.random() * 4) - 2).toFixed(1) + 'x'; // Add variance
                         results.comparables.push({
                              name: `${isPublic ? 'Public' : 'Private'} ${industry} Comp ${String.fromCharCode(65 + i)}`,
                              type: isPublic ? 'Public' : 'Private',
                              metricValue: isPublic ? `$${Math.floor(Math.random()*500)+50}M Rev` : `~$${Math.floor(Math.random()*50)+10}M Rev (Est.)`,
                              multiple: `${compMultiple} LTM Revenue`
                         });
                   }
                   // Add known comp if provided
                    if (params.knownComps) {
                         results.comparables.unshift({
                             name: params.knownComps.split(',')[0].trim(),
                             type: 'User Specified',
                             metricValue: 'N/A',
                             multiple: 'N/A'
                         });
                    }


                   // Simulate Valuation
                   const lowRange = (parseFloat(context.revenueMetric.match(/[\d.]+/)?.[0] || '1') * (baseMultiple - 1.5)).toFixed(0);
                   const highRange = (parseFloat(context.revenueMetric.match(/[\d.]+/)?.[0] || '1') * (baseMultiple + 1.5)).toFixed(0);
                   const unit = context.revenueMetric.includes('M') ? 'M' : (context.revenueMetric.includes('k') ? 'k' : '');
                    results.valuation = {
                         benchmarks: [
                              { metric: 'EV / LTM Revenue Multiple', multiple: `${baseMultiple.toFixed(1)}x` },
                              // Add other multiples if relevant data was requested/provided
                         ],
                         range: `$${lowRange}${unit} - $${highRange}${unit}`,
                         basis: `Based on median LTM Revenue multiple of ${baseMultiple.toFixed(1)}x derived from comparable companies and applied to current revenue metric (${context.revenueMetric}). Range adjusted for growth rate (${context.growthRate}) and market sentiment.`
                    };


                   // Simulate Considerations
                   results.considerations = [
                        `Current market volatility may impact valuation multiples and IPO window timing.`,
                        `Achieving consistent ${context.growthRate} growth is critical for maintaining valuation.`,
                        `Integration challenges could arise in potential M&A scenarios with Large ${industry} Inc.`,
                        `Strengthening the management team in [Specific Area, e.g., Finance] could improve IPO readiness.`
                   ];


                return results;
            }

            // --- Utility Functions ---
             function escapeHtml(unsafe) {
                 if (unsafe === null || typeof unsafe === 'undefined') return '';
                 const div = document.createElement('div');
                 div.textContent = String(unsafe);
                 return div.innerHTML;
             }
            function formatBytes(bytes, decimals = 2) { /* Keep for consistency if needed */
                 if (!+bytes) return '0 Bytes'; const k = 1024; const dm = decimals < 0 ? 0 : decimals; const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB']; const i = Math.floor(Math.log(bytes) / Math.log(k)); return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
            }

            // --- Initial Setup ---
             checkIfReadyToAnalyze(); // Initial button state check
             resultsSection.classList.add('hidden'); // Ensure results are hidden initially

             // Event Listeners
             // Add listeners to all required context inputs
             [companyNameInput, industryInput, stageSelect, revenueInput, growthInput, descriptionInput].forEach(el => {
                  el.addEventListener('input', checkIfReadyToAnalyze);
                  if (el.tagName === 'SELECT') {
                      el.addEventListener('change', checkIfReadyToAnalyze);
                  }
             });
             // Add listeners to checkboxes to re-check button state
              exitFocusCheckboxes.forEach(cb => {
                  cb.addEventListener('change', checkIfReadyToAnalyze);
              });

             analyzeButton.addEventListener('click', runAnalysis);

        }); // End DOMContentLoaded
    </script>

</body>
