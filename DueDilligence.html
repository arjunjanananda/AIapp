<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Swag - Due Diligence Summarizer</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* --- Base Styles & Variables (Dark Theme) --- */
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-primary: #4a90e2; /* Blue */
            --accent-secondary: #e67e22; /* Orange for diligence/warnings */
            --border-color: #3a3a3a;
            --border-light: #555;
            --card-border: #444;
            --danger-color: #e74c3c;
            --success-color: #2ecc71; /* Green for positive findings */
            --font-family: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .summarizer-container {
            max-width: 1100px; /* Good width */
            margin: 20px auto;
            padding: 25px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .summarizer-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px; /* Space below header */
        }

        .summarizer-header h1 {
            font-size: 1.8em;
            font-weight: 600;
            color: var(--accent-secondary);
        }
        .summarizer-header h1 i {
            margin-right: 10px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: var(--text-primary);
        }
        .back-link i {
            margin-right: 5px;
        }

        /* --- Step Section Styling --- */
         .step-section {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }
         .step-section h2 {
             font-size: 1.3em;
             font-weight: 600;
             margin-bottom: 20px;
             color: var(--text-primary);
             border-bottom: 1px solid var(--border-light);
             padding-bottom: 10px;
              display: flex;
             align-items: center;
             gap: 10px;
         }
          .step-section h2 .step-number {
              background-color: var(--accent-secondary);
              color: var(--bg-primary);
              border-radius: 50%;
              width: 28px;
              height: 28px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              font-size: 0.8em;
              font-weight: bold;
          }

        /* --- File Upload (Multiple) --- */
        .upload-area {
            border: 2px dashed var(--border-light);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            margin-bottom: 15px;
            background-color: var(--bg-input);
        }
        .upload-area:hover {
            background-color: rgba(230, 126, 34, 0.1); /* Accent color tint */
            border-color: var(--accent-secondary);
        }
        .upload-area i {
            font-size: 2.5em;
            color: var(--accent-secondary);
            margin-bottom: 10px;
        }
        .upload-area p {
            margin-bottom: 5px;
            font-size: 0.95em;
            color: var(--text-secondary);
        }
        .upload-area span {
            color: var(--accent-secondary);
            font-weight: 500;
            text-decoration: underline;
        }
         .upload-area small {
            color: var(--text-secondary);
            font-size: 0.8em;
            display: block;
            margin-top: 8px;
        }

         #uploaded-files-list {
             list-style: none;
             padding: 0;
             margin-top: 15px;
             max-height: 150px;
             overflow-y: auto;
             border: 1px solid var(--border-color);
             border-radius: 4px;
             background-color: var(--bg-input);
         }
          #uploaded-files-list li {
             display: flex;
             justify-content: space-between;
             align-items: center;
             padding: 8px 12px;
             border-bottom: 1px solid var(--border-color);
             font-size: 0.9em;
         }
          #uploaded-files-list li:last-child {
             border-bottom: none;
         }
           #uploaded-files-list .file-icon { margin-right: 8px; color: var(--text-secondary); }
           #uploaded-files-list .file-name { flex-grow: 1; margin-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
           #uploaded-files-list .remove-file-btn {
              background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.1em; padding: 0 5px; opacity: 0.7;
          }
           #uploaded-files-list .remove-file-btn:hover { opacity: 1; }


        /* --- Context Section --- */
        .context-grid {
             display: grid;
             grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
             gap: 20px;
         }
         .form-group {
             display: flex;
             flex-direction: column;
         }
         .form-group label {
             margin-bottom: 6px;
             font-size: 0.9em;
             color: var(--text-secondary);
             font-weight: 500;
         }
          .form-group label i { margin-right: 5px; }
         .form-group select,
         .form-group textarea {
             width: 100%;
             padding: 10px 12px;
             background-color: var(--bg-input);
             border: 1px solid var(--border-color);
             border-radius: 4px;
             color: var(--text-primary);
             font-family: inherit;
             font-size: 0.95em;
         }
          .form-group textarea {
             min-height: 80px;
             resize: vertical;
         }
          .form-group select:focus,
          .form-group textarea:focus {
              outline: none;
              border-color: var(--accent-primary);
              box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.3);
          }

        /* --- Summarize Button --- */
        .summarize-trigger-section {
            text-align: center;
            padding-top: 15px;
            margin-bottom: 25px;
        }
        #summarize-button {
            padding: 12px 35px;
            font-size: 1.1em;
            background-color: var(--accent-secondary);
            color: var(--bg-primary);
            font-weight: 600;
        }
        #summarize-button:hover { background-color: #c06a1a; } /* Darker orange */
        #summarize-button:disabled {
             opacity: 0.5; cursor: not-allowed; background-color: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color);
        }

        /* --- Results Section --- */
        #results-section {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }
        #results-section h2 {
            font-size: 1.4em; font-weight: 600; margin-bottom: 20px; color: var(--text-primary); border-bottom: 1px solid var(--border-light); padding-bottom: 10px; display: flex; align-items: center; gap: 10px;
        }
        #results-section h2 .step-number { /* Reuse step number style */
            background-color: var(--accent-secondary); color: var(--bg-primary); border-radius: 50%; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: bold;
        }

        #summary-status {
            text-align: center; margin-bottom: 25px; font-size: 1.1em; color: var(--accent-primary); padding: 15px; background-color: var(--bg-input); border-radius: 6px;
        }
        #summary-status i { margin-right: 8px; }

        .summary-results {
            display: flex; flex-direction: column; gap: 25px; /* Space between result blocks */
        }
        .result-block {
            background-color: var(--bg-input); padding: 20px; border-radius: 6px; border-left: 5px solid; /* Use border for visual type */
        }
        .result-block.summary { border-left-color: var(--accent-primary); }
        .result-block.positives { border-left-color: var(--success-color); }
        .result-block.risks { border-left-color: var(--danger-color); } /* Use danger for risks */
        .result-block.concerns { border-left-color: var(--warning-color); } /* Yellow for concerns */

        .result-block h3 {
            font-size: 1.2em; font-weight: 600; color: var(--text-primary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        /* Assign colors to icons based on block type */
        .result-block.summary h3 i { color: var(--accent-primary); }
        .result-block.positives h3 i { color: var(--success-color); }
        .result-block.risks h3 i { color: var(--danger-color); }
        .result-block.concerns h3 i { color: var(--warning-color); }

        .result-block .content p, .result-block .content ul {
            font-size: 0.95em; line-height: 1.6; color: var(--text-primary); margin-bottom: 10px;
        }
         .result-block .content ul { list-style: disc; padding-left: 25px; }
         .result-block .content li { margin-bottom: 8px; }
         .result-block .content strong { /* Highlight key terms */
            color: var(--text-primary); font-weight: 600;
         }
         .result-block .content .risk-level-high { color: var(--danger-color); font-weight: bold;}
         .result-block .content .risk-level-medium { color: var(--warning-color); font-weight: bold;}
         .result-block .content .risk-level-low { color: var(--text-secondary); font-weight: bold;}


        /* General Button Style */
        .btn {
            padding: 9px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.95em; font-weight: 500; transition: background-color 0.2s ease, opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease; font-family: var(--font-family); display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
        }
        .btn i { margin-right: 8px; }

        /* Utility */
        .hidden { display: none !important; }
    </style>

</head>
<body>

    <div class="summarizer-container">
        <header class="summarizer-header">
            <a href="AIApp222.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Hub</a>
            <h1><i class="fas fa-file-signature"></i> Due Diligence Summarizer</h1>
        </header>

        <section id="input-section" class="step-section">
             <h2><span class="step-number">1</span> Upload Documents & Define Context</h2>
             <div class="context-options-grid"> <!-- Using grid for side-by-side layout -->
                 <div class="form-group file-upload-group"> <!-- File Upload -->
                     <label for="file-upload-input"><i class="fas fa-folder-open"></i> Upload DD Documents*</label>
                     <div class="upload-area" id="upload-area">
                        <input type="file" id="file-upload-input" accept=".pdf,.doc,.docx,.txt" multiple hidden/> <!-- Allow multiple files -->
                        <label for="file-upload-input">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Drag & Drop document(s) here</p>
                            <p>or <span>Browse Files</span></p>
                            <small>(Supports: PDF, DOCX, TXT)</small>
                        </label>
                    </div>
                     <ul id="uploaded-files-list">
                        <li id="no-files-message" style="color: var(--text-secondary); font-style: italic;">No files selected.</li>
                     </ul>
                 </div>

                 <div class="form-group context-group"> <!-- Context Inputs -->
                     <label for="deal-context"><i class="fas fa-info-circle"></i> Purpose / Deal Context*</label>
                     <select id="deal-context">
                        <option value="">Select Purpose...</option>
                        <option value="M&A Target">M&A Target Acquisition</option>
                        <option value="VC Investment">VC Investment</option>
                        <option value="Strategic Partnership">Strategic Partnership</option>
                        <option value="Internal Audit">Internal Audit</option>
                        <option value="Other">Other</option>
                     </select>

                    <label for="areas-concern" style="margin-top: 15px;"><i class="fas fa-exclamation-triangle"></i> Key Areas of Focus/Concern (Optional)</label>
                    <textarea id="areas-concern" rows="5" placeholder="List specific aspects you want the AI to pay close attention to, e.g.:
- Intellectual property ownership and risks
- Customer concentration and churn rate
- Pending or potential litigation
- Scalability of the technology stack
- Accuracy of financial projections"></textarea>
                 </div>
            </div>
        </section>

         <section id="summarize-trigger-section" class="step-section summarize-trigger-section">
            <button id="summarize-button" class="btn" disabled><i class="fas fa-play-circle"></i> Summarize Diligence Findings</button>
        </section>

        <section id="results-section" class="step-section hidden">
             <h2><span class="step-number">2</span> Analysis Results</h2>
             <div id="summary-status" class="hidden">
                 <i class="fas fa-spinner fa-spin"></i> Summarizing documents and identifying key findings...
             </div>
             <div id="summary-results" class="summary-results hidden">
                 <!-- Result blocks will be appended here by JS -->
             </div>
        </section>

    </div> <!-- End summarizer Container -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-upload-input');
            const fileInfoDiv = document.getElementById('file-info'); // Not used, list is better
            const fileListUl = document.getElementById('uploaded-files-list');
            const noFilesMessageLi = document.getElementById('no-files-message');

            const dealContextSelect = document.getElementById('deal-context');
            const areasConcernInput = document.getElementById('areas-concern');

            const summarizeButton = document.getElementById('summarize-button');
            const resultsSection = document.getElementById('results-section');
            const summaryStatus = document.getElementById('summary-status');
            const summaryResultsContainer = document.getElementById('summary-results');

            let selectedFiles = []; // Store the File objects

            // --- Functions ---

            function handleFiles(files) {
                noFilesMessageLi.classList.add('hidden'); // Hide default message

                for (const file of files) {
                    // Basic validation
                    const allowedExtensions = /(\.pdf|\.docx?|\.txt)$/i;
                     if (!allowedExtensions.exec(file.name)) {
                        alert(`Skipping unsupported file type: ${file.name}. Please upload PDF, DOCX, or TXT.`);
                        continue; // Skip this file
                    }
                    // Avoid adding duplicates
                    if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                         selectedFiles.push(file);
                         addFileToListUI(file);
                    }
                }
                checkIfReadyToSummarize();
            }

             function addFileToListUI(file) {
                 const li = document.createElement('li');
                 li.dataset.fileName = file.name; // Store name for removal
                 li.innerHTML = `
                     <i class="fas fa-file-alt file-icon"></i>
                     <span class="file-name" title="${escapeHtml(file.name)} (${formatBytes(file.size)})">${escapeHtml(file.name)}</span>
                     <button class="remove-file-btn" title="Remove file">×</button>
                 `;
                 fileListUl.appendChild(li);

                 // Add event listener to the remove button
                 li.querySelector('.remove-file-btn').addEventListener('click', () => {
                     removeFile(file.name);
                     li.remove();
                     checkIfReadyToSummarize();
                 });
             }

             function removeFile(fileName) {
                 selectedFiles = selectedFiles.filter(f => f.name !== fileName);
                  if (selectedFiles.length === 0) {
                     noFilesMessageLi.classList.remove('hidden');
                 }
                 console.log("Remaining files:", selectedFiles);
             }


            function checkIfReadyToSummarize() {
                // Define required context fields
                const contextValue = dealContextSelect.value;

                // Enable button only if files selected AND required context field is filled
                summarizeButton.disabled = !(selectedFiles.length > 0 && contextValue);
            }

            function runSummarization() {
                if (selectedFiles.length === 0 || summarizeButton.disabled) return;

                 // Capture context and concerns at the time of analysis
                 const analysisContext = {
                     purpose: dealContextSelect.value,
                     concerns: areasConcernInput.value.trim() || null,
                     filenames: selectedFiles.map(f => f.name) // Send filenames for reference
                 };

                console.log("Summarizing documents:", analysisContext.filenames);
                console.log("Context:", analysisContext);

                // Show processing state
                resultsSection.classList.remove('hidden'); // Show the section
                summaryStatus.classList.remove('hidden'); // Show spinner
                summaryResultsContainer.innerHTML = ''; // Clear previous results
                summaryResultsContainer.classList.add('hidden'); // Hide results container itself
                summarizeButton.disabled = true; // Disable button
                summarizeButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Summarizing...';
                 // Optional: Disable inputs while processing
                 // document.querySelectorAll('.step-section input, .step-section select, .step-section textarea').forEach(el => el.disabled = true);

                // --- *** SIMULATE BACKEND ANALYSIS (Gemini API Call) *** ---
                // In a real app:
                // 1. Upload `selectedFiles` to your backend.
                // 2. Backend extracts text content from each file (using appropriate libraries for PDF, DOCX).
                // 3. Send the extracted text (potentially concatenated or chunked), along with `analysisContext`, to Gemini.
                // 4. Prompt Engineering is CRITICAL. Instruct Gemini to:
                //    - Understand the `purpose` of the DD.
                //    - Pay special attention to the `concerns` listed by the user.
                //    - Read through all provided document text.
                //    - Generate a concise **Executive Summary**.
                //    - Extract **Key Positive Findings** relevant to the context.
                //    - Extract **Key Risks / Red Flags**, potentially categorizing them (Legal, Financial, Technical, Market) and assigning a rough severity (High, Medium, Low).
                //    - If concerns were listed, generate a section addressing findings **Specifically Related to Concerns**.
                //    - Return the results in a structured format (JSON is best).

                setTimeout(() => {
                    summaryStatus.classList.add('hidden');
                    summarizeButton.disabled = false; // Re-enable button
                    summarizeButton.innerHTML = '<i class="fas fa-play-circle"></i> Summarize Diligence Findings';
                     // Re-enable inputs if they were disabled
                     // document.querySelectorAll('.step-section input, .step-section select, .step-section textarea').forEach(el => el.disabled = false);

                    // --- *** DISPLAY SIMULATED RESULTS *** ---
                    const simulatedResults = getSimulatedResults(analysisContext);
                    displayResults(simulatedResults);

                    console.log("Simulated summarization complete.");

                }, 4000 + Math.random() * 2000); // Simulate longer analysis time for multiple/large docs
            }

            function displayResults(results) {
                 summaryResultsContainer.innerHTML = ''; // Clear again just in case
                 summaryResultsContainer.classList.remove('hidden'); // Show the container

                 // 1. Executive Summary
                 if (results.summary) {
                     summaryResultsContainer.innerHTML += createResultBlockHTML('summary', 'Executive Summary', 'fas fa-file-alt', `<p>${escapeHtml(results.summary)}</p>`);
                 }

                 // 2. Key Positive Findings
                 if (results.positives && results.positives.length > 0) {
                      const positiveItems = results.positives.map(item => `<li>${escapeHtml(item)}</li>`).join('');
                      summaryResultsContainer.innerHTML += createResultBlockHTML('positives', 'Key Positive Findings', 'fas fa-thumbs-up', `<ul>${positiveItems}</ul>`);
                 }

                 // 3. Key Risks / Red Flags
                 if (results.risks && results.risks.length > 0) {
                       const riskItems = results.risks.map(item => `<li><span class="risk-level-${item.level.toLowerCase()}">[${item.level}]</span> ${escapeHtml(item.finding)}</li>`).join('');
                       summaryResultsContainer.innerHTML += createResultBlockHTML('risks', 'Key Risks / Red Flags', 'fas fa-exclamation-triangle', `<ul>${riskItems}</ul>`);
                 } else {
                      // Optionally add a block saying no major risks found
                       summaryResultsContainer.innerHTML += createResultBlockHTML('positives', 'Key Risks / Red Flags', 'fas fa-exclamation-triangle', `<p>No significant risks or red flags identified based on the analysis.</p>`);
                 }

                 // 4. Specific Concerns Addressed (If applicable)
                 if (results.concernsAddressed && results.concernsAddressed.length > 0) {
                      const concernItems = results.concernsAddressed.map(item => `<li><strong>${escapeHtml(item.concern)}:</strong> ${escapeHtml(item.finding)}</li>`).join('');
                       summaryResultsContainer.innerHTML += createResultBlockHTML('concerns', 'Findings Related to Your Key Concerns', 'fas fa-search', `<ul>${concernItems}</ul>`);
                 }

            }

            // Helper to create HTML for a result block
            function createResultBlockHTML(typeClass, title, iconClass, contentHTML) {
                 return `
                    <div class="result-block ${typeClass}">
                        <h3><i class="fas ${iconClass}"></i> ${escapeHtml(title)}</h3>
                        <div class="content">${contentHTML}</div>
                    </div>`;
            }


            function getSimulatedResults(context) {
                // Generate dummy results based on context
                const results = {
                    summary: `The due diligence review for the ${context.purpose} of [Target Company Name, inferred] reveals several key areas. While there are positive indicators like [Positive Area 1], potential risks exist concerning [Risk Area 1] and [Risk Area 2], particularly relevant given your focus.`,
                    positives: [
                        "Strong intellectual property portfolio identified with clear ownership.",
                        "Experienced management team with relevant industry background.",
                        "Positive customer feedback and evidence of early market traction.",
                        `Financial projections show a plausible path to profitability within 3 years (needs stress testing).`
                    ],
                    risks: [
                         // Randomly add risks
                         ...(Math.random() > 0.3 ? [{ level: 'High', finding: "Significant customer concentration risk: Top 2 clients represent 65% of current revenue." }] : []),
                         ...(Math.random() > 0.4 ? [{ level: 'Medium', finding: "Pending litigation regarding [Minor Issue] identified in legal review (potential cost exposure)."}] : []),
                         ...(Math.random() > 0.5 ? [{ level: 'Medium', finding: "Technical scalability requires further investigation; current architecture may not support projected growth beyond Year 2 without significant refactoring."}] : []),
                         ...(Math.random() > 0.6 ? [{ level: 'Low', finding: "Some employment contracts lack standard non-compete clauses (minor legal risk)."}] : []),
                         ...(context.purpose === 'VC Investment' ? [{level: 'Medium', finding: "Valuation expectations seem high compared to current traction and market benchmarks."}] : [])
                    ],
                    concernsAddressed: []
                };

                 // Add simulated findings for user concerns
                 if (context.concerns) {
                     const concernsList = context.concerns.split('\n').map(c => c.replace(/^-?\s*/, '').trim()).filter(Boolean);
                     concernsList.forEach(concern => {
                         if (concern.toLowerCase().includes("ip") || concern.toLowerCase().includes("intellectual property")) {
                              results.concernsAddressed.push({ concern: concern, finding: "IP review confirmed key patents are registered and owned by the company. No immediate infringement risks found in provided docs." });
                         } else if (concern.toLowerCase().includes("customer") || concern.toLowerCase().includes("churn")) {
                              results.concernsAddressed.push({ concern: concern, finding: "As noted in risks, customer concentration is high. Churn rate data provided appears standard for the industry but covers a short period." });
                         } else if (concern.toLowerCase().includes("litigation") || concern.toLowerCase().includes("legal")) {
                              results.concernsAddressed.push({ concern: concern, finding: "One pending minor lawsuit was found (see Risks). No other major legal disputes were apparent in the reviewed documents." });
                         } else {
                              // Generic fallback for other concerns
                               results.concernsAddressed.push({ concern: concern, finding: `Analysis indicates [Plausible Finding] related to your concern about "${escapeHtml(concern)}". Further details can be found in the [Relevant Document Type, e.g., Technical Report].` });
                         }
                     });
                 }

                 // Ensure risks list isn't empty if concerns weren't specifically about risks that got added
                 if (results.risks.length === 0 && Math.random() > 0.5) {
                     results.risks.push({level: 'Low', finding: 'Standard operational risks identified, consistent with companies at this stage.'});
                 }


                return results;
            }

            // --- Utility Functions ---
             function escapeHtml(unsafe) {
                 if (unsafe === null || typeof unsafe === 'undefined') return '';
                 const div = document.createElement('div');
                 div.textContent = String(unsafe);
                 return div.innerHTML;
             }
            function formatBytes(bytes, decimals = 2) {
                if (!+bytes) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
            }

            // --- Initial Setup ---
             checkIfReadyToSummarize(); // Initial button state check
             resultsSection.classList.add('hidden'); // Ensure results are hidden initially

             // Event Listeners
             fileInput.addEventListener('change', (e) => handleFiles(e.target.files)); // Use handleFiles for multiple
             [dealContextSelect, areasConcernInput].forEach(el => { // Check readiness on context change too
                  el.addEventListener('input', checkIfReadyToSummarize);
                 if (el.tagName === 'SELECT') {
                     el.addEventListener('change', checkIfReadyToSummarize);
                 }
             });
             summarizeButton.addEventListener('click', runSummarization);

        }); // End DOMContentLoaded
    </script>

</body>
